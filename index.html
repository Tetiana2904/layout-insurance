<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="main.css" />
        <title>Document</title>
    </head>
    <body>
        <header class="header">
            <div class="header__container">
                <div class="header__content">
                    <a class="header__logo" href="#">
                        <span class="header__logo-text">trip страхование</span>
                    </a>
                    <nav class="header__nav">
                        <a class="header__link" href="#"
                            >Продукты
                            <img
                                class="header__arrow"
                                src="./images/arrow-down.svg"
                                alt=""
                            />
                        </a>
                        <a class="header__link" href="#">Отзывы</a>
                        <a class="header__link" href="#">Партнерам</a>
                    </nav>
                    <button class="header__button">
                        <img src="./images/discount-icon.svg" alt="" />
                        Скидки
                    </button>
                    <div class="header__menu">
                        <img src="./images/header-menu.svg" alt="menu" />
                    </div>
                </div>
            </div>
        </header>
        <main>
            <section class="insurance">
                <div class="insurance__content">
                    <h2>Страхование путешественников</h2>
                    <p>Полис, который действительно работает</p>
                    <form class="insurance__form">
                        <input
                            class="insurance__input"
                            type="text"
                            placeholder="Куда едем?"
                        />
                        <div class="insurance__date">
                            <img src="./images/date.svg" alt="" />
                            <input type="date" />
                        </div>
                        <div class="insurance__date">
                            <img src="./images/date.svg" alt="" />
                            <input type="date" />
                        </div>
                        <div class="insurance__people">
                            <span>1 человек</span>
                            <img src="./images/user-icon.svg" alt="" />
                        </div>
                    </form>
                    <button class="insurance__button">Узнать стоимость</button>
                </div>
            </section>
        </main>
        <script src="./main.js"></script>
    </body>
</html>
